name: CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Pasos para descargar el código
    - name: Checkout code
      uses: actions/checkout@v3

    # Configurar el entorno de Python
    - name: Set up Python 3.9
      uses: actions/setup-python@v3
      with:
        python-version: "3.9"

    # Instalar las dependencias necesarias
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 nose pylint
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 2. Un paso para analizar el código en busca de errores (Linting)
    - name: Lint with flake8
      run: |
        flake8 service --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 service --count --max-complexity=10 --max-line-length=127 --statistics

    # 3. Un paso para ejecutar pruebas unitarias con nosetests
    - name: Run unit tests with nosetests
      run: |
        nosetests -v --with-spec --spec-color --with-coverage --cover-package=app
